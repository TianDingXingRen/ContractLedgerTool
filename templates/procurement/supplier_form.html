{% extends "base.html" %}{% block title %}编辑候选供应商{% endblock %}{% block breadcrumb %}采购前置 / 编辑供应商{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto"><h1 class="text-2xl font-bold mb-5">编辑候选供应商</h1>{% if error %}<div class="alert alert-error mb-4">{{ error }}</div>{% endif %}<form method="post" class="card bg-base-100 border border-base-300"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body grid grid-cols-1 md:grid-cols-2 gap-4"><label class="form-control md:col-span-2"><span class="label-text">供应商名称 *</span><input class="input input-bordered" required name="supplier_name" value="{{ supplier.supplier_name }}"></label><label class="form-control"><span class="label-text">联系人</span><input class="input input-bordered" name="contact_person" value="{{ supplier.contact_person }}"></label><label class="form-control"><span class="label-text">联系电话</span><input class="input input-bordered" name="contact_phone" value="{{ supplier.contact_phone }}"></label><label class="form-control md:col-span-2"><span class="label-text">邮箱</span><input class="input input-bordered" type="email" name="email" value="{{ supplier.email }}"></label><label class="form-control md:col-span-2"><span class="label-text">备注</span><textarea class="textarea textarea-bordered" name="remark">{{ supplier.remark }}</textarea></label><div class="md:col-span-2 flex justify-end gap-2"><a class="btn btn-ghost" href="{{ url_for('procurement.procurement_project_detail', project_id=project_id) }}">取消</a><button class="btn btn-primary">保存</button></div></div></form></div>{% endblock %}
