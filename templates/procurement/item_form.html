{% extends "base.html" %}{% block title %}编辑采购明细{% endblock %}{% block breadcrumb %}采购前置 / 编辑明细{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto"><h1 class="text-2xl font-bold mb-5">编辑采购明细</h1>{% if error %}<div class="alert alert-error mb-4">{{ error }}</div>{% endif %}<form method="post" class="card bg-base-100 border border-base-300"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body grid grid-cols-1 md:grid-cols-2 gap-4"><label class="form-control"><span class="label-text">物资名称 *</span><input class="input input-bordered" required name="item_name" value="{{ item.item_name }}"></label><label class="form-control"><span class="label-text">规格型号</span><input class="input input-bordered" name="spec_model" value="{{ item.spec_model }}"></label><label class="form-control"><span class="label-text">图号/代号</span><input class="input input-bordered" name="drawing_no" value="{{ item.drawing_no }}"></label><label class="form-control"><span class="label-text">数量 *</span><input class="input input-bordered" required type="number" min="0.000001" step="any" name="quantity" value="{{ item.quantity_text }}"></label><label class="form-control"><span class="label-text">单位 *</span><input class="input input-bordered" required name="unit" value="{{ item.unit }}"></label><label class="form-control"><span class="label-text">要求交期</span><input class="input input-bordered" type="date" name="required_delivery_date" value="{{ item.required_delivery_date }}"></label><label class="form-control md:col-span-2"><span class="label-text">技术要求</span><textarea class="textarea textarea-bordered" name="technical_requirement">{{ item.technical_requirement }}</textarea></label><label class="form-control md:col-span-2"><span class="label-text">备注</span><textarea class="textarea textarea-bordered" name="remark">{{ item.remark }}</textarea></label><div class="md:col-span-2 flex justify-end gap-2"><a class="btn btn-ghost" href="{{ url_for('procurement.procurement_project_detail', project_id=project_id) }}">取消</a><button class="btn btn-primary">保存</button></div></div></form></div>{% endblock %}
