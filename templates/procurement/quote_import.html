{% extends "base.html" %}
{% block title %}导入供应商报价{% endblock %}
{% block breadcrumb %}采购前置 / 导入报价{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold mb-1">导入标准报价</h1>
      <p class="text-sm text-base-content/50 mb-5">{{ project.project_no }} / {{ project.project_name }}</p>
    </div>
    <a class="btn btn-sm" href="{{ url_for('procurement_quote_mapping_upload', project_id=project.id) }}">非标准文件映射</a>
  </div>

  {% if error %}<div class="alert alert-error mb-4">{{ error }}</div>{% endif %}

  <form method="post" enctype="multipart/form-data" class="card bg-base-100 border border-base-300">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card-body gap-4">
      <label class="form-control">
        <span class="label-text">候选供应商</span>
        <select class="select select-bordered" required name="supplier_id">
          <option value="">请选择</option>
          {% for supplier in suppliers %}
          <option value="{{ supplier.id }}">{{ supplier.supplier_name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="form-control">
        <span class="label-text">报价轮次</span>
        <input class="input input-bordered" type="number" min="1" name="quote_round" value="1">
      </label>
      <label class="form-control">
        <span class="label-text">标准报价 Excel</span>
        <input class="file-input file-input-bordered" required type="file" accept=".xlsx" name="file">
      </label>
      <div class="alert alert-info text-sm">文件会先解析并展示预览，确认后才写入正式报价数据。</div>
      <div class="flex flex-wrap justify-end gap-2">
        <button
          class="btn btn-outline"
          type="submit"
          formaction="{{ url_for('procurement_quote_template_selected', project_id=project.id) }}"
          formmethod="get"
          formnovalidate
        >下载标准报价模板</button>
        <a class="btn btn-ghost" href="{{ url_for('procurement_project_detail', project_id=project.id) }}">返回</a>
        <button class="btn btn-primary" type="submit">解析文件</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
