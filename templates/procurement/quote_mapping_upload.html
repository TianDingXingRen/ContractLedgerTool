{% extends "base.html" %}{% block title %}非标准报价映射{% endblock %}{% block breadcrumb %}采购前置 / 非标准报价{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto"><h1 class="text-2xl font-bold">非标准报价字段映射</h1><p class="text-sm text-base-content/50 mb-5">支持 Excel、Word 表格和 PDF 表格；扫描 PDF 需要本机 Tesseract。</p>{% if error %}<div class="alert alert-error mb-4">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="card bg-base-100 border border-base-300"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body gap-4"><label class="form-control"><span class="label-text">供应商</span><select required class="select select-bordered" name="supplier_id"><option value="">请选择</option>{% for supplier in suppliers %}<option value="{{ supplier.id }}">{{ supplier.supplier_name }}</option>{% endfor %}</select></label><label class="form-control"><span class="label-text">报价轮次</span><input class="input input-bordered" type="number" min="1" value="1" name="quote_round"></label><label class="form-control"><span class="label-text">报价文件</span><input required class="file-input file-input-bordered" type="file" accept=".xlsx,.docx,.pdf" name="file"></label><div class="flex justify-end gap-2"><a class="btn btn-ghost" href="{{ url_for('procurement.procurement_quote_import', project_id=project.id) }}">返回</a><button class="btn btn-primary">读取文件</button></div></div></form></div>{% endblock %}
