name: 缺陷报告
description: 报告可复现的软件问题；安全漏洞请使用私密报告渠道
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除合同、供应商、账号和密钥等敏感信息。
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: GitHub Release 版本号或提交哈希
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他或非 Windows
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定的操作步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
      description: 请勿上传真实合同或任何个人、银行、商业敏感数据
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题
          required: true
        - label: 我已移除报告中的敏感数据
          required: true
        - label: 这不是尚未修复的安全漏洞
          required: true
