name: 功能建议
description: 提议新的工作流、能力或易用性改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前业务场景和具体阻碍
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的交互、输入和输出
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已搜索现有 Issue 和 Pull Request
          required: true
        - label: 示例中不包含真实合同或敏感数据
          required: true
