name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked release toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          npm ci
          python -m playwright install chromium

      - name: Run release gate and build single installer
        run: python scripts/quality_gate.py release --build-installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContractLedgerTool-${{ github.ref_name }}
          path: dist/release/ContractLedgerTool_OfflineInstaller.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist\release\ContractLedgerTool_OfflineInstaller.exe" `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
